<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <div class="login-container">
        <h2>ログイン</h2>

        <input
            type="email"
            class="login-email"
            placeholder="メールアドレス">

        <input
            type="password"
            class="login-password"
            placeholder="パスワード">

        <button class="login-btn">
            ログイン
        </button>
    </div>

    <script src="./login.js"></script>


</body>
</html>
