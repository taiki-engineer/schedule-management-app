<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スケジュール管理</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="mobile-header">

        <button class="menu-btn">☰</button>

    </header>
    
    <div class="container">

        <!-- 左 -->
        <aside class="sideber">
            <h2>メニュー</h2>
            <ul>
                <li class="menu-item home-menu">ホーム</li>
                <li class="menu-item schedule-menu">スケジュール</li>
                <li class="menu-item list-menu">予定一覧</li>
                <li class="menu-item task-menu">タスク一覧</li>
            </ul>

            <div class="category">
                <h3>カテゴリー</h3>


                <div class="category-item work">仕事</div>

                <div class="category-item study">勉強</div>

                <div class="category-item exercise">運動</div>

                <div class="category-item private">プライベート</div>

                <div class="category-item others">その他</div>

            </div>
        </aside>

        <section class="home-page hidden">
            <h2>ホーム</h2>

            <div class="stats-container">
                <div class="stat-card">
                    <h3>今日の予定</h3>
                    <p class="today-schedule-count">0</p> 
                </div>
                
                <div class="stat-card">
                    <h3>未完了タスク</h3>
                    <p class="unfinished-task-count">0</p>
                </div>

                <div class="stat-card">
                    <h3>完了タスク</h3>
                    <p class="completed-task-count">0</p>
                </div>

                <div class="stat-card">
                    <h3>総タスク数</h3>
                    <p class="total-task-count">0</p>
                </div>
            </div>

            <div class="home-container">
                <div class="today-schedule-card">
                    <h3>今日の予定</h3>
                    <div class="today-schedule-list"></div>
                </div>

                <div class="today-task-card">
                    <h3>タスク</h3>
                    <div class="today-task-list"></div>
                </div>
            </div>
        </section>


        <section class="schedule-page">
            <main class="calender-area">
                <div class="calender-header">
                    <button class="prevBtn"><</button>
                    <h2 class="month-title"></h2>
                    <button class="nextBtn">></button>
                </div>

                <div class="week-row">

                    <div class="week">日</div>
                    <div class="week">月</div>
                    <div class="week">火</div>
                    <div class="week">水</div>
                    <div class="week">木</div>
                    <div class="week">金</div>
                    <div class="week">土</div>

                </div>

                <div class="calender"></div>

                <div class="mobile-schedule-section">

                    <h3 class="selected-date-title">
                        日付を選択してください
                    </h3>

                    <div class="schedule-list"></div>

                </div>
                

            </main>
        

            <!-- 右 -->
            <section class="schedule-fome">
                <h2>予定追加</h2>

                <label>日付</label>
                <input type="date" class="date-input">

                <label>時間</label>
                <input type="time" class="time-input">

                <div class="input-group">
                    <label>カテゴリー</label>

                    <select class="category-select">

                    <option>仕事</option>
                    <option>勉強</option>
                    <option>運動</option>
                    <option>プライベート</option>
                    <option>その他</option>

                    </select>

                </div>
                
                <label>タイトル</label>
                <input type="text" class="title-input">

                <label>メモ</label>
                <textarea class="memo-input"></textarea>

                <button class="add-btn">追加</button>

            </section>
        </section>

        <section class="list-page hidden">
            <h2>予定一覧</h2>
            
            <div class="schedule-list-container"></div>
        </section>

        <section class="task-page hidden">
            <h2>タスク一覧</h2>

            <div class="task-container">

                <div class="task-list-container">
                    <!-- タスク表示 -->
                </div>

                <div class="task-form">

                    <input type="text" class="task-input" placeholder="タスクを入力">

                    <select class="task-category">
                        <option>仕事</option>
                        <option>勉強</option>
                        <option>運動</option>
                        <option>プライベート</option>
                        <option>その他</option>
                    </select>

                    <button class="task-add-btn">追加</button>
                </div>
            </div>
        </section>

    </div>

    <!-- スマホ用モーダル -->
    <div class="modal hidden">

        <div class="modal-content">

            <h2 class="modal-title">予定編集</h2>

            <label>日付</label>
            <input type="date" class="date-input edit-date">

            <label>時間</label>
            <input type="time" class="time-input edit-time">

            <label>カテゴリー</label>
            <select class="category-select edit-category">
                <option>仕事</option>
                <option>勉強</option>
                <option>運動</option>
                <option>プライベート</option>
                <option>その他</option>
            </select>

            <label>タイトル</label>
            <input type="text" class="title-input edit-title">

            <label>メモ</label>
            <textarea class="memo-input edit-memo"></textarea>

            <div class="modal-buttons">
                <button class="save-edit-btn">
                    保存
                </button>

                <button class="close-modal-btn">
                    閉じる
                </button>
            </div>

        </div>

    </div>

    <button class="floating-add-btn">+</button>

    <script src="./main.js"></script>

</body>
</html>
